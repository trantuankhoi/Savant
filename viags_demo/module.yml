name: ${oc.env:MODULE_NAME, 'demo'}

parameters:
  # DevMode (hot Python code reload on file change)
  dev_mode: True
  # Allows sending shutdown message to the module with the auth-key (see below)
  shutdown_auth: "shutdown"
  # enable OpenTelemetry
  telemetry:
    tracing:
      sampling_period: 100
      root_span_name: pipeline
      provider: jaeger
      provider_params:
        service_name: demo-pipeline
        protocol: grpc
        endpoint: "http://jaeger:4317"
  sidebar_width: 296
  frame:
    width: 1280
    height: 720
  output_frame:
    codec: ${oc.env:CODEC, 'raw-rgba'}
  log_level: DEBUG
  draw_func:
    module: viags_demo.src.module.overlay
    class_name: Overlay
    kwargs:
      config_path: ${oc.env:PROJECT_PATH}/viags_demo/area_config.yml
      sidebar_width: ${parameters.sidebar_width}
      target_obj_label: person

pipeline:

  elements:
    - element: nvinfer@detector
      name: yolov8m
      model:
        remote:
          url: s3://savant-data/models/yolov8m_f630b10/yolov8m_f630b10.zip
          checksum_url: s3://savant-data/models/yolov8m_f630b10/yolov8m_f630b10.md5
          parameters:
            endpoint: https://eu-central-1.linodeobjects.com
        format: onnx
        model_file: yolov8m.onnx
        config_file: config_infer_primary_yoloV8.txt
        batch_size: 3
        workspace_size: 6144
        output:
          objects:
            - class_id: 0
              label: person

    - element: nvtracker
      properties:
        ll-lib-file: /opt/nvidia/deepstream/deepstream/lib/libnvds_nvmultiobjecttracker.so
        ll-config-file: ${oc.env:PROJECT_PATH}/samples/assets/tracker/config_tracker_NvDCF_perf.yml
        tracker-width: 960  # 640  # must be a multiple of 32
        tracker-height: 544  # 384
        display-tracking-id: 0

    - element: pyfunc
      module: viags_demo.src.module.object_counting
      class_name: ObjectCounting
      kwargs:
        config_path: ${oc.env:PROJECT_PATH}/viags_demo/area_config.yml
        target_obj_label: person
        send_stats: True
